<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minha Biblioteca</title>
    <link rel="stylesheet" href="./dist/output.css" />
  </head>
  <body class="bg-slate-100 min-h-screen">
    <!-- 1. Cabeçalho -->
    <header class="bg-white shadow px-6 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-sky-600">AnimeTeca</h1>
      <button class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600">
        Sair
      </button>
    </header>

    <main class="max-w-6x1 mx-auto p-6">
    <!-- 2. Abas de Filtro -->

    <!-- 3. Barra de Pesquisa -->

    <!-- 4. Grid de Cards -->
<div id="grid-animes" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4">

    <!-- Card exemplo-->
     <div class="bg-white rounded-lg shadow overflow-hidden">
        <img src="https://placehold.co/300x450" alt="Capa" class="w-full aspect-[2/3] object-cover">

        <div class="p-3">
            <h2 class="font-bold truncate">Nome do Anime</h2>
            <p class="text-sm text-amber-500">nota: 8.5</p>

            <p class="text-xs text-slate-500 mt-2">12 / 24 episódios</p>
            <div class="w-full bg-slate-200 rounded-full h-2">
                <div class="bg-sky-500 h-2 rounded-full" style="width: 50%"></div>
            </div>
        </div>
     </div>

    </main>
    <script src="./js/dados.js"></script>
    <script src="./js/biblioteca.js"></script>
  </body>
</html>
