<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minha Biblioteca</title>
    <link rel="stylesheet" href="./dist/output.css" />

    <!-- Proteção: sem login, volta para a tela de login (index.html) -->
    <script src="./js/sessao.js"></script>
    <script>verificarLogin();</script>
  </head>
  <body class="bg-slate-100 dark:bg-slate-950 min-h-screen">
    <!-- 1. Cabeçalho -->
    <header
      class="bg-white dark:bg-slate-900 border-b-2 border-indigo-500 px-6 py-4 flex justify-between items-center"
    >
      <h1 class="text-2xl font-black tracking-tight text-slate-800 dark:text-slate-100">
        <span class="text-indigo-500">Anime</span>Teca
      </h1>

      <div class="flex items-center gap-2">
        <!-- Abre o modal de cadastro (js/cadastro.js) -->
        <button
          onclick="abrirModalCadastro()"
          class="bg-indigo-600 text-white text-sm px-4 py-2 rounded-sm hover:bg-indigo-500 transition-colors"
        >
          + Novo anime
        </button>

        <!-- Botão do modo escuro -->
        <button
          id="botao-tema"
          onclick="alternarTema()"
          class="px-4 py-2 rounded-sm border text-sm transition-colors bg-white border-slate-300 text-slate-700 hover:border-indigo-500 dark:bg-slate-950 dark:border-slate-700 dark:text-slate-200 dark:hover:border-indigo-500"
        >
          Modo escuro
        </button>

        <button
          onclick="sair()"
          class="bg-red-500 text-white text-sm px-4 py-2 rounded-sm hover:bg-red-600"
        >
          Sair
        </button>
      </div>
    </header>

    <main class="max-w-6xl mx-auto p-6">
      <!-- 2. Abas de Filtro -->
      <div class="flex flex-wrap gap-2 mb-4">
        <button
          onclick="filtrarPorStatus('todos')"
          data-status="todos"
          class="aba px-4 py-2 rounded-sm border text-sm transition-colors bg-indigo-600 text-white border-indigo-600"
        >
          Todos
        </button>

        <button
          onclick="filtrarPorStatus('assistindo')"
          data-status="assistindo"
          class="aba px-4 py-2 rounded-sm border text-sm transition-colors bg-white text-slate-600 border-slate-300 dark:bg-slate-900 dark:text-slate-300 dark:border-slate-700"
        >
          Assistindo
        </button>

        <button
          onclick="filtrarPorStatus('finalizado')"
          data-status="finalizado"
          class="aba px-4 py-2 rounded-sm border text-sm transition-colors bg-white text-slate-600 border-slate-300 dark:bg-slate-900 dark:text-slate-300 dark:border-slate-700"
        >
          Finalizados
        </button>

        <button
          onclick="filtrarPorStatus('na-fila')"
          data-status="na-fila"
          class="aba px-4 py-2 rounded-sm border text-sm transition-colors bg-white text-slate-600 border-slate-300 dark:bg-slate-900 dark:text-slate-300 dark:border-slate-700"
        >
          Na Fila
        </button>
      </div>
      <!-- 3. Barra de Pesquisa -->
      <input
        id="busca"
        type="text"
        oninput="pesquisar()"
        placeholder="Pesquisar pelo título..."
        class="w-full sm:w-80 mb-6 px-4 py-2 rounded-sm border text-sm outline-none transition-colors bg-white border-slate-300 text-slate-800 focus:border-indigo-500 dark:bg-slate-900 dark:border-slate-700 dark:text-slate-200 dark:placeholder-slate-500"
      />
      <!-- 4. Grid de Cards -->
      <!-- Os cards são criados pelo JavaScript (js/biblioteca.js) -->
      <div
        id="grid-animes"
        class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4"
      ></div>
    </main>

    <!-- ===================== MODAL DE CADASTRO ===================== -->
    <!-- <dialog> é o modal nativo do HTML: abre com showModal() e fecha com close() -->
    <dialog
      id="modal-cadastro"
      class="m-auto w-full max-w-lg rounded-sm border border-slate-200 bg-white p-0 text-slate-800 shadow-2xl backdrop:bg-black/70 dark:border-indigo-500 dark:bg-slate-900 dark:text-slate-100"
    >
      <form id="form-cadastro" onsubmit="salvarCadastro(event)" class="space-y-4 p-6">
        <h2 class="text-lg font-bold">Adicionar anime</h2>

        <div class="flex gap-4">
          <!-- Prévia da capa: muda enquanto a pessoa cola o link -->
          <img
            id="c-preview"
            alt="Prévia da capa"
            referrerpolicy="no-referrer"
            class="w-24 aspect-2/3 shrink-0 rounded-sm object-cover border border-slate-200 dark:border-slate-700"
          />

          <div class="flex-1 space-y-3">
            <div>
              <label for="c-titulo" class="mb-1 block text-xs font-medium text-slate-500 dark:text-slate-400">Título *</label>
              <!-- "required" faz o navegador barrar o envio se estiver vazio -->
              <input id="c-titulo" name="titulo" type="text" required
                class="w-full rounded-sm border border-slate-300 bg-white px-3 py-2 text-sm outline-none focus:border-indigo-500 dark:border-slate-700 dark:bg-slate-950" />
            </div>

            <div>
              <label for="c-imagem" class="mb-1 block text-xs font-medium text-slate-500 dark:text-slate-400">Link da imagem</label>
              <input id="c-imagem" name="imagem" type="text" placeholder="https://..." oninput="atualizarPreview()"
                class="w-full rounded-sm border border-slate-300 bg-white px-3 py-2 text-sm outline-none focus:border-indigo-500 dark:border-slate-700 dark:bg-slate-950" />
              <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">
                Dica: no Pinterest ou no Google, clique com o botão direito na imagem e escolha
                "Copiar endereço da imagem".
              </p>
              <!-- Avisos sobre o link (preenchido pelo JavaScript) -->
              <p id="c-aviso-imagem" class="mt-1 text-xs text-amber-500"></p>
            </div>
          </div>
        </div>

        <div>
          <label for="c-status" class="mb-1 block text-xs font-medium text-slate-500 dark:text-slate-400">Status</label>
          <select id="c-status" name="status"
            class="w-full rounded-sm border border-slate-300 bg-white px-3 py-2 text-sm outline-none focus:border-indigo-500 dark:border-slate-700 dark:bg-slate-950">
            <option value="assistindo">Assistindo</option>
            <option value="finalizado">Finalizado</option>
            <option value="na-fila" selected>Na Fila</option>
          </select>
        </div>

        <div class="grid grid-cols-3 gap-3">
          <div>
            <label for="c-nota" class="mb-1 block text-xs font-medium text-slate-500 dark:text-slate-400">Nota (0-10)</label>
            <input id="c-nota" name="nota" type="number" min="0" max="10" step="0.5"
              class="w-full rounded-sm border border-slate-300 bg-white px-3 py-2 text-sm outline-none focus:border-indigo-500 dark:border-slate-700 dark:bg-slate-950" />
          </div>
          <div>
            <label for="c-vistos" class="mb-1 block text-xs font-medium text-slate-500 dark:text-slate-400">Eps vistos</label>
            <input id="c-vistos" name="episodiosVistos" type="number" min="0" value="0" required
              class="w-full rounded-sm border border-slate-300 bg-white px-3 py-2 text-sm outline-none focus:border-indigo-500 dark:border-slate-700 dark:bg-slate-950" />
          </div>
          <div>
            <label for="c-total" class="mb-1 block text-xs font-medium text-slate-500 dark:text-slate-400">Eps total</label>
            <input id="c-total" name="totalEpisodios" type="number" min="1" value="12" required
              class="w-full rounded-sm border border-slate-300 bg-white px-3 py-2 text-sm outline-none focus:border-indigo-500 dark:border-slate-700 dark:bg-slate-950" />
          </div>
        </div>

        <!-- Mensagem de erro (preenchida pelo JavaScript) -->
        <p id="c-erro" class="text-sm text-red-500"></p>

        <div class="flex justify-end gap-2">
          <button type="button" onclick="fecharModal('modal-cadastro')"
            class="rounded-sm px-4 py-2 text-sm hover:bg-slate-100 dark:hover:bg-slate-800">Cancelar</button>
          <button type="submit"
            class="rounded-sm bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-500">Salvar</button>
        </div>
      </form>
    </dialog>

    <!-- ===================== MODAL DE EDIÇÃO ===================== -->
    <!-- Edita o que o PDF pede: status, nota e episódios vistos -->
    <dialog
      id="modal-edicao"
      class="m-auto w-full max-w-md rounded-sm border border-slate-200 bg-white p-0 text-slate-800 shadow-2xl backdrop:bg-black/70 dark:border-indigo-500 dark:bg-slate-900 dark:text-slate-100"
    >
      <form id="form-edicao" onsubmit="salvarEdicao(event)" class="space-y-4 p-6">
        <div>
          <h2 class="text-lg font-bold">Editar anime</h2>
          <p id="e-titulo-anime" class="text-sm text-slate-500 dark:text-slate-400"></p>
        </div>

        <div>
          <label for="e-status" class="mb-1 block text-xs font-medium text-slate-500 dark:text-slate-400">Status</label>
          <select id="e-status" name="status"
            class="w-full rounded-sm border border-slate-300 bg-white px-3 py-2 text-sm outline-none focus:border-indigo-500 dark:border-slate-700 dark:bg-slate-950">
            <option value="assistindo">Assistindo</option>
            <option value="finalizado">Finalizado</option>
            <option value="na-fila">Na Fila</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="e-nota" class="mb-1 block text-xs font-medium text-slate-500 dark:text-slate-400">Nota (0-10)</label>
            <input id="e-nota" name="nota" type="number" min="0" max="10" step="0.5"
              class="w-full rounded-sm border border-slate-300 bg-white px-3 py-2 text-sm outline-none focus:border-indigo-500 dark:border-slate-700 dark:bg-slate-950" />
          </div>
          <div>
            <label for="e-vistos" class="mb-1 block text-xs font-medium text-slate-500 dark:text-slate-400">
              Eps vistos <span id="e-total-texto"></span>
            </label>
            <input id="e-vistos" name="episodiosVistos" type="number" min="0" required
              class="w-full rounded-sm border border-slate-300 bg-white px-3 py-2 text-sm outline-none focus:border-indigo-500 dark:border-slate-700 dark:bg-slate-950" />
          </div>
        </div>

        <p id="e-erro" class="text-sm text-red-500"></p>

        <div class="flex justify-end gap-2">
          <button type="button" onclick="fecharModal('modal-edicao')"
            class="rounded-sm px-4 py-2 text-sm hover:bg-slate-100 dark:hover:bg-slate-800">Cancelar</button>
          <button type="submit"
            class="rounded-sm bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-500">Salvar alterações</button>
        </div>
      </form>
    </dialog>

    <script src="./js/dados.js"></script>
    <script src="./js/feedback.js"></script>
    <script src="./js/biblioteca.js"></script>
    <script src="./js/cadastro.js"></script>
    <script src="./js/acoes.js"></script>
  </body>
</html>
