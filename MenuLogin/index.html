<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu de Login</title>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="card-header">
        <h1><span>⛩️ LOGIN ⛩️</span></h1>
        <p>Entre para gerenciar sua lista de animes</p>
      </div>

      <form class="login-form">
        <div>
          <label for="username">Nome de usuário ou Email</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Ex: otaku_placeholder"
            required
          />
        </div>

        <div>
          <div class="label-row">
            <label for="password">Sua senha secreta</label>
            <a href="#forgot">Esqueceu a senha?</a>
          </div>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            required
          />
        </div>

        <button type="submit">Entrar no Mundo Anime</button>
      </form>

      <div class="card-footer">
        <p>
          Novo por aqui?
          <a href="#register">Criar minha conta de Otaku</a>
        </p>
      </div>
    </div>
  </div>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #020617; font-family: Arial, sans-serif; }
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: #e2e8f0;
    }
    .login-card {
      width: min(420px, 100%);
      padding: 44px;
      border: 1px solid #334155;
      border-bottom-width: 2px;
      border-radius: 4px;
      background: #0f172a;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.35);
    }
    .card-header { margin-bottom: 24px; }
    .card-header h1 { margin: 0; font-size: 24px; }
    .card-header h1 span { color: #6366f1; font-weight: 900; }
    .card-header p { margin: 8px 0 0; color: #94a3b8; font-size: 14px; }
    .login-form { display: grid; gap: 16px; }
    .login-form label { display: block; margin-bottom: 4px; color: #94a3b8; font-size: 12px; font-weight: 600; }
    .label-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
    .label-row label { margin: 0; }
    .login-form input {
      width: 100%;
      padding: 10px;
      border: 1px solid #334155;
      background: #020617;
      color: #e2e8f0;
      font-size: 14px;
      outline: none;
    }
    .login-form input:focus { border-color: #6366f1; }
    .login-form button {
      width: 100%;
      margin-top: 8px;
      padding: 11px;
      border: 0;
      background: #4f46e5;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(79, 70, 229, 0.2);
    }
    .login-form button:hover { background: #6366f1; }
    a { color: #818cf8; font-size: 12px; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .card-footer { margin-top: 32px; padding-top: 24px; border-top: 1px solid #1e293b; text-align: center; }
    .card-footer p { margin: 0; color: #64748b; font-size: 12px; }
    .card-footer a { font-weight: 600; }
  </style>
</body>
</html>
