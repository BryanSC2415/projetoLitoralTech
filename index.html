<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnimeTeca - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">

  <!-- 👤 Pessoa 1: Login e Cadastro -->
  <div class="bg-slate-800 rounded-xl p-8 w-full max-w-sm">
    <h1 class="text-3xl font-bold mb-6 text-center">
      <span class="text-pink-500">Anime</span>Teca
    </h1>

    <!-- Aviso (sessão expirada, erros, etc.) -->
    <p id="aviso" class="hidden bg-red-500/20 text-red-300 text-sm rounded p-2 mb-4"></p>

    <!-- FORMULÁRIO DE LOGIN -->
    <form id="formLogin" onsubmit="entrar(event)">
      <label class="block text-sm mb-1">E-mail</label>
      <input id="loginEmail" type="email" class="w-full bg-slate-700 rounded p-2 mb-3">

      <label class="block text-sm mb-1">Senha</label>
      <input id="loginSenha" type="password" class="w-full bg-slate-700 rounded p-2 mb-4">

      <button class="w-full bg-pink-500 hover:bg-pink-600 rounded p-2 font-bold">Entrar</button>

      <p class="text-sm text-center mt-4 text-slate-400">
        Não tem conta?
        <button type="button" onclick="mostrarCadastro()" class="text-pink-400 underline">Cadastre-se</button>
      </p>
    </form>

    <!-- FORMULÁRIO DE CADASTRO (começa escondido) -->
    <form id="formCadastro" class="hidden" onsubmit="cadastrar(event)">
      <label class="block text-sm mb-1">Nome</label>
      <input id="cadNome" type="text" class="w-full bg-slate-700 rounded p-2 mb-3">

      <label class="block text-sm mb-1">E-mail</label>
      <input id="cadEmail" type="email" class="w-full bg-slate-700 rounded p-2 mb-3">

      <label class="block text-sm mb-1">Senha</label>
      <input id="cadSenha" type="password" class="w-full bg-slate-700 rounded p-2 mb-4">

      <button class="w-full bg-pink-500 hover:bg-pink-600 rounded p-2 font-bold">Criar conta</button>

      <p class="text-sm text-center mt-4 text-slate-400">
        Já tem conta?
        <button type="button" onclick="mostrarLogin()" class="text-pink-400 underline">Entrar</button>
      </p>
    </form>

    <p class="text-xs text-center mt-6 text-slate-500">Teste: demo@email.com / 123456</p>
  </div>

  <script src="js/dados.js"></script>
  <script src="js/seguranca.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
